<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Le tre barre 1 / X / 2 nei colori delle serie del sito, e la tacca
       verticale del mercato che le attraversa: è il segno che compare in ogni
       riga di calendario, ridotto a icona. -->
  <rect width="32" height="32" rx="4" fill="#101619"/>
  <rect x="5" y="9" width="10" height="14" fill="#4A90CC"/>
  <rect x="16" y="13" width="5" height="10" fill="#B5842A"/>
  <rect x="22" y="15" width="5" height="8" fill="#A06BB8"/>
  <rect x="17.4" y="6" width="1.6" height="20" fill="#E9EAE5"/>
</svg>

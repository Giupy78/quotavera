name: Aggiornamento notturno

# Ogni notte alle due italiane. `0 0` in UTC, che d'estate a Roma sono le 02:00
# e d'inverno le 01:00.
#
# La deriva di un'ora fra ora legale e solare e' voluta. Qui prima c'era una
# guardia che verificava che a Roma fosse *esattamente* l'ora giusta, con due
# cron per coprire le due stagioni: sembrava preciso ed era fragile, perche'
# bastava un ritardo di GitHub — cosa che capita — perche' l'orologio di Roma
# segnasse l'ora dopo e il lavoro si saltasse da solo, in silenzio. Per un
# aggiornamento dati un'ora non la nota nessuno; un turno saltato si'.
#
# Le due di notte funzionano bene rispetto alle fonti: football-data aggiorna i
# suoi file verso le 22:20 UTC (lo dicono le intestazioni Last-Modified) ed ESPN
# pubblica entro pochi minuti dal fischio, quindi anche la partita europea piu'
# tarda e' chiusa da un pezzo.
#
# Una cosa da sapere: l'orario e' quello richiesto, non quello garantito. Le
# pianificazioni di GitHub Actions vengono servite con ritardo variabile — il
# 29 agosto un turno previsto per le 02:17 UTC e' partito alle 09:06, quasi
# sette ore dopo. Il lavoro parte comunque, ma non contarci al minuto.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:        # per lanciarlo a mano dalla scheda Actions

permissions:
  contents: write           # serve a scrivere il commit con i dati nuovi

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze del motore
        run: pip install -r requirements.txt

      - name: I test del motore devono passare
        # Se il motore è rotto, i dati non si rigenerano. Meglio un sito fermo
        # a ieri che un sito aggiornato con numeri sbagliati.
        run: python -m pytest -q

      - name: Rigenera i dati
        run: python scripts/genera_sito.py

      - name: Il lunedì rifà anche il track record
        # Costa parecchi minuti — ristima il modello centinaia di volte
        # camminando in avanti su nove stagioni — e cambia molto lentamente:
        # rifarlo ogni notte sarebbe spreco. Una volta a settimana basta.
        run: |
          GIORNO=$(TZ=Europe/Rome date +%u)
          if [ "$GIORNO" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/track_record.py
          else
            echo "Non è lunedì: il track record resta quello della settimana scorsa."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sito/package-lock.json

      - name: Il sito deve compilare
        # Si compila qui, prima di committare: se la build fallisce non si
        # manda in produzione un commit che rompe il deploy.
        #
        # `working-directory` e non `npm --prefix`: quest'ultimo confonde npm
        # su dove cercare i binari installati, e fallisce in modi poco chiari.
        working-directory: sito
        run: |
          npm ci
          npm run build

      - name: Congela i dati di stanotte
        # Il commit non è rumore: è l'archivio. Ogni notte resta agli atti cosa
        # sapeva il modello e quali quote vedeva, e non è più modificabile.
        # È la condizione senza cui un track record non si può dimostrare.
        #
        # `dati/espn` va committato per una ragione diversa e altrettanto
        # concreta: è la memoria dei tabellini già scaricati. La macchina di
        # GitHub nasce e muore ogni notte, quindi senza questo archivio nel
        # repository il lavoro rifarebbe da capo una richiesta per partita su
        # tutta la stagione, ogni volta. Sono 600 KB che evitano qualche
        # migliaio di richieste inutili a un servizio che ci regala i dati.
        #
        # Quando le fonti non hanno pubblicato niente di nuovo non c'è nulla da
        # committare, e va bene così: è un turno riuscito, non un errore.
        run: |
          git config user.name "Quota Vera"
          git config user.email "actions@users.noreply.github.com"
          git add sito/src/dati dati/espn
          if git diff --staged --quiet; then
            echo "Nessun cambiamento nei dati: le fonti non hanno aggiornato."
          else
            git commit -m "dati: aggiornamento del $(TZ=Europe/Rome date +%Y-%m-%d)"
            git push
          fi
